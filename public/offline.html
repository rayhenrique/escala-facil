<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0A4D59">
    <title>Sem conexão · Escala Fácil</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; color: #12333a; background: #f3f8f7; }
        main { width: min(100%, 32rem); padding: 2rem; border: 1px solid #c9dad7; border-radius: .75rem; background: #fff; box-shadow: 0 1rem 2.5rem rgba(18, 51, 58, .08); }
        .brand { display: flex; align-items: center; gap: .75rem; font-weight: 700; }
        .mark { display: grid; width: 3rem; height: 3rem; place-items: center; border-radius: .8rem; color: #fff; background: #0f6674; }
        h1 { margin: 2rem 0 .75rem; font-size: clamp(1.75rem, 8vw, 2.5rem); letter-spacing: -.035em; }
        p { margin: 0; color: #5e7377; line-height: 1.7; }
        button { width: 100%; min-height: 3rem; margin-top: 1.5rem; border: 0; border-radius: .5rem; color: #fff; background: #0f6674; font: inherit; font-weight: 700; cursor: pointer; }
        button:hover { background: #0a4d59; }
        small { display: block; margin-top: 1rem; color: #5e7377; line-height: 1.5; }
    </style>
</head>
<body>
    <main>
        <div class="brand"><span class="mark" aria-hidden="true">✓</span><span>Escala Fácil</span></div>
        <h1>Você está sem conexão</h1>
        <p>Conecte-se à internet para consultar dados atualizados, registrar solicitações ou tomar decisões sobre a escala.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
        <small>Por segurança, escalas e dados de usuários não ficam armazenados para consulta offline neste dispositivo.</small>
    </main>
</body>
</html>
