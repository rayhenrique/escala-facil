name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (PHP ${{ matrix.php }} · Node ${{ matrix.node }} · ${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        node: ['24']
        database: ['sqlite', 'mysql']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: escala_facil_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, dom, fileinfo, filter, gd, hash, iconv, intl, json, libxml, mbstring, openssl, pcre, pdo, pdo_mysql, pdo_sqlite, session, simplexml, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Verify testing environment file
        run: test -f .env.testing

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Run test suite (sqlite)
        if: matrix.database == 'sqlite'
        run: php artisan test

      - name: Run test suite (mysql)
        if: matrix.database == 'mysql'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: escala_facil_testing
          DB_USERNAME: root
          DB_PASSWORD: password
          DB_ENGINE: InnoDB
        run: php artisan test

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Test landing animation lifecycle
        run: npm run test:landing

      - name: Test PWA release cache invalidation
        run: npm run test:pwa

      - name: Test authentication presentation lifecycle
        run: npm run test:auth
